<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f5c">
  <meta name="description" content="Suivi de budget personnel, chiffré et hors connexion.">
  <title>Mon Budget</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Écran de verrouillage / création du code -->
  <section id="lock" class="lock">
    <div class="lock-inner">
      <div class="lock-logo">€</div>
      <h1 id="lock-title">Mon Budget</h1>
      <p id="lock-msg" class="lock-msg">Entrez votre code</p>
      <form id="name-step" class="name-step" hidden>
        <input id="name-input" type="text" maxlength="30" autocomplete="given-name" placeholder="Votre prénom" aria-label="Votre prénom">
        <button class="btn" type="submit">Continuer</button>
      </form>
      <div id="pin-dots" class="pin-dots" aria-live="polite"></div>
      <p id="lock-error" class="lock-error" role="alert"></p>
      <div class="pad" id="pad">
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
        <button data-k="del" class="pad-alt" aria-label="Effacer">⌫</button>
        <button data-k="0">0</button>
        <button data-k="ok" class="pad-ok" aria-label="Valider">OK</button>
      </div>
      <p id="lock-warning" class="lock-warning" hidden></p>
      <button id="lock-restore" class="btn ghost" type="button"></button>
    </div>
  </section>

  <!-- Application (visible une fois déverrouillée) -->
  <div id="app" class="app" hidden>
    <header class="topbar">
      <button class="icon-btn" id="prev-month" aria-label="Mois précédent">‹</button>
      <h2 id="month-label">—</h2>
      <button class="icon-btn" id="next-month" aria-label="Mois suivant">›</button>
    </header>

    <div id="banners"></div>
    <div id="favbar" class="favbar" hidden></div>

    <main id="view"></main>

    <button id="fab" class="fab" aria-label="Ajouter une dépense">+</button>

    <nav class="tabbar">
      <button data-tab="home" class="active"><span>🏠</span>Accueil</button>
      <button data-tab="expenses"><span>🧾</span>Dépenses</button>
      <button data-tab="incomes"><span>💶</span>Revenus</button>
      <button data-tab="year"><span>📊</span>Année</button>
      <button data-tab="settings"><span>⚙️</span>Réglages</button>
    </nav>
  </div>

  <!-- Fenêtre (formulaires) -->
  <div id="sheet-backdrop" class="sheet-backdrop" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <div id="sheet-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden><span id="toast-msg"></span><button id="toast-btn" hidden></button></div>

  <script src="store.js"></script>
  <script src="xlsx.js"></script>
  <script src="app.js"></script>
  <script src="export.js"></script>
  <script src="backup.js"></script>
</body>
</html>
